<body>

    <div class="heading">
        <h1>Etch A Sketch</h1>
    </div>

    <div class="display">

        <div class="option-panel">
            <input type="color" name="" id="color-select" value="#000000">
            <button class="color-mode">Color Mode</button>
            <button class="rainbow-mode">Rainbow Mode</button>
            <div class="range-slider">
                <input type="range" name="" id="range-select" min="0" max="100" value="16">
            </div>
        </div>


        <div class="grid">

        </div>

    </div>
