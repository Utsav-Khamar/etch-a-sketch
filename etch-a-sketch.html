<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch A Sketch</title>

    <link rel="stylesheet" href="./normalize.css">
    <link rel="stylesheet" href="./etch-a-sketch.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">

    <script src="./etch-a-sketch.js" defer></script>
</head>

<body>

    <header class="heading">

        <img class="side-image left" src="./assets/star1.png" alt="">
        <div class="text">
            <h1>Etch A Sketch</h1>
            <img class="stroke" src="./assets/Lavender-Brushstroke-Underline.png" alt="">

        </div>
        <img class="side-image right" src="./assets/star2.png" alt="">

    </header>
    <div class="sub-heading">
        <p>Draw freely using different colors and grid sizes.</p>
    </div>

    <div class="display">

        <div class="option-panel">
            <input type="color" name="" id="color-select" value="#000000">
            <button class="color-mode">Color Mode</button>
            <button class="rainbow-mode">Rainbow Mode</button>
            <div class="range-slider">
                <input type="range" name="" id="range-select" min="0" max="100" value="16">
            </div>
        </div>


        <div class="grid">

        </div>

    </div>

    <footer>
        <p>Made with ❤️ by <a href="https://github.com/Utsav-Khamar">Utsav</a>, all thanks to <a
                href="https://www.theodinproject.com/"><span>The Odin Project</span></a>.</p>
        <a href="./mario.html">mario</a>
    </footer>
</body>

</html>
